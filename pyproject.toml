[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_mcp_north"]

[project]
name = "qgis-mcp-north"
version = "0.4.0"
description = "Focused QGIS MCP server for transportation research figure pipelines (PFLOW, GUFM). Forked from nkarasiak/qgis-mcp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.20.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]
pptx = ["python-pptx>=1.0"]
trajectory = ["movingpandas>=0.20"]

[project.scripts]
qgis-mcp-north-server = "qgis_mcp_north.server:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"_archive/*" = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
