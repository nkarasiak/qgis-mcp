name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so a new dependency major surfaces here and not in an issue (#25)
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: locked
            # Exactly what uv.lock pins - what contributors and the plugin see
            fresh: false
          - name: unpinned
            # Fresh resolution, like `uvx --from <zip>`: every dependency at its
            # newest release, so an SDK or dev-tool major fails here first
            fresh: true
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install (locked)
        if: ${{ !matrix.fresh }}
        run: uv sync --frozen

      - name: Install (newest of everything)
        if: ${{ matrix.fresh }}
        run: |
          uv lock --upgrade
          uv sync
          uv pip list | grep -Ei '^(mcp|pydantic|anyio|pytest|pytest-asyncio) '

      - name: Lint
        if: ${{ !matrix.fresh }}
        # Pinned: an unpinned linter turns CI red on untouched code.
        # flake8 mirrors the plugin uploader (W503 on, see .flake8).
        run: |
          uvx ruff@0.16.0 check qgis_mcp_plugin/ src/ tests/ install.py
          uvx flake8@7.3.0 qgis_mcp_plugin/

      - name: Unit tests (mocked socket, no QGIS)
        run: uv run --no-sync pytest tests/ -v
